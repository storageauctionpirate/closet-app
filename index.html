<script>
'use strict';
/* ================= color science ================= */
const lin=c=>{c/=255;return c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4)};
const unlin=c=>{c=c<=.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-.055;return Math.max(0,Math.min(255,Math.round(c*255)))};
function rgb2lab(r,g,b){r=lin(r);g=lin(g);b=lin(b);
  let x=(r*.4124+g*.3576+b*.1805)/.95047,y=r*.2126+g*.7152+b*.0722,z=(r*.0193+g*.1192+b*.9505)/1.08883;
  const f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;x=f(x);y=f(y);z=f(z);return[116*y-16,500*(x-y),200*(y-z)]}
function lab2rgb(L,a,b){let y=(L+16)/116,x=a/500+y,z=y-b/200;const fi=t=>{const t3=t*t*t;return t3>.008856?t3:(t-16/116)/7.787};
  x=fi(x)*.95047;y=fi(y);z=fi(z)*1.08883;
  return[unlin(x*3.2406+y*-1.5372+z*-.4986),unlin(x*-.9689+y*1.8758+z*.0415),unlin(x*.0557+y*-.204+z*1.057)]}
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgb2hex=c=>'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');
const lab2hex=l=>rgb2hex(lab2rgb(...l));
const lch=l=>{const C=Math.hypot(l[1],l[2]);let h=Math.atan2(l[2],l[1])*180/Math.PI;if(h<0)h+=360;return{L:l[0],C,h}};
const hdiff=(a,b)=>{const d=Math.abs(a-b)%360;return d>180?360-d:d};
function de2000(l1,l2){const[L1,a1,b1]=l1,[L2,a2,b2]=l2,rad=Math.PI/180;
  const C1=Math.hypot(a1,b1),C2=Math.hypot(a2,b2),Cb=(C1+C2)/2,G=.5*(1-Math.sqrt(Math.pow(Cb,7)/(Math.pow(Cb,7)+Math.pow(25,7))));
  const a1p=(1+G)*a1,a2p=(1+G)*a2,C1p=Math.hypot(a1p,b1),C2p=Math.hypot(a2p,b2);
  let h1p=Math.atan2(b1,a1p)/rad;if(h1p<0)h1p+=360;let h2p=Math.atan2(b2,a2p)/rad;if(h2p<0)h2p+=360;
  const dL=L2-L1,dC=C2p-C1p;let dh=h2p-h1p;if(C1p*C2p===0)dh=0;else if(dh>180)dh-=360;else if(dh<-180)dh+=360;
  const dH=2*Math.sqrt(C1p*C2p)*Math.sin(dh*rad/2),Lb=(L1+L2)/2,Cbp=(C1p+C2p)/2;
  let hb=h1p+h2p;if(C1p*C2p!==0){if(Math.abs(h1p-h2p)>180)hb+=(hb<360?360:-360);hb/=2}
  const T=1-.17*Math.cos((hb-30)*rad)+.24*Math.cos(2*hb*rad)+.32*Math.cos((3*hb+6)*rad)-.2*Math.cos((4*hb-63)*rad);
  const dth=30*Math.exp(-Math.pow((hb-275)/25,2)),Rc=2*Math.sqrt(Math.pow(Cbp,7)/(Math.pow(Cbp,7)+Math.pow(25,7)));
  const Sl=1+.015*Math.pow(Lb-50,2)/Math.sqrt(20+Math.pow(Lb-50,2)),Sc=1+.045*Cbp,Sh=1+.015*Cbp*T,Rt=-Math.sin(2*dth*rad)*Rc;
  return Math.sqrt(Math.pow(dL/Sl,2)+Math.pow(dC/Sc,2)+Math.pow(dH/Sh,2)+Rt*(dC/Sc)*(dH/Sh))}

/* named shade library: [name, hex, family, kind]  kind: n=neutral, e=earth neutral, c=color */
const SHADES=[
['black','#141414','black','n'],['soft black','#25252a','black','n'],['charcoal','#3a3f47','gray','n'],['slate gray','#5b6470','gray','n'],['gray','#8a8d91','gray','n'],['heather gray','#a7a9ac','gray','n'],['light gray','#cfd0d1','gray','n'],['white','#f4f4f2','white','n'],['ivory','#f3eedf','white','n'],['cream','#ece0c4','cream','e'],['oatmeal','#d6c9ad','cream','e'],['beige','#d4bf9c','beige','e'],['khaki','#c3b091','beige','e'],['tan','#b48e64','brown','e'],['camel','#c19a6b','brown','e'],['taupe','#8b7d6b','brown','e'],['cognac','#9a4e25','brown','e'],['brown','#6f4e37','brown','e'],['chocolate','#45302a','brown','e'],
['navy','#1f2a44','navy','n'],['midnight navy','#171c33','navy','n'],['olive','#636332','olive','e'],['army green','#4b5320','olive','e'],['olive drab','#6b6a3a','olive','e'],
['true red','#c41e2a','red','c'],['cherry red','#b11226','red','c'],['scarlet','#e03c31','red','c'],['tomato red','#e5533d','red','c'],['crimson','#a6192e','red','c'],
['maroon','#6e2236','maroon','c'],['burgundy','#7a1e33','maroon','c'],['wine maroon','#6a2139','maroon','c'],['oxblood','#4a1117','maroon','c'],['brick maroon','#7e3326','maroon','c'],['rust','#a0432a','orange','c'],
['berry','#8a1c4a','pink','c'],['raspberry','#b3245c','pink','c'],['hot pink','#e0408e','pink','c'],['dusty rose','#c08081','pink','c'],['blush','#e8b4b8','pink','c'],['mauve','#a57a8b','pink','c'],['coral','#f27c6b','pink','c'],
['bright orange','#e2701c','orange','c'],['burnt orange','#c1561e','orange','c'],['terracotta','#c66b4b','orange','c'],['peach','#f5b895','orange','c'],['apricot','#f1a66a','orange','c'],
['mustard','#c9a227','yellow','c'],['golden yellow','#d9ac2c','yellow','c'],['lemon','#f2e35c','yellow','c'],['butter yellow','#f3e3a0','yellow','c'],
['sage','#9caf88','green','c'],['mint','#a8dcc1','green','c'],['emerald','#1f7a4d','green','c'],['forest green','#2c4a34','green','c'],['kelly green','#3a9d3a','green','c'],['lime','#a8c545','green','c'],['teal','#1f7a7a','teal','c'],['turquoise','#3fb5b0','teal','c'],
['royal blue','#2a52be','blue','c'],['cobalt','#1e4fa3','blue','c'],['sky blue','#87b6e0','blue','c'],['powder blue','#b5cce3','blue','c'],['slate blue','#5a6e8c','blue','c'],['steel blue','#4a6f96','blue','c'],
['lavender','#b9a6d4','purple','c'],['lilac','#c8a2c8','purple','c'],['plum','#5e2a4b','purple','c'],['eggplant','#3d1f3a','purple','c'],['violet','#6a4c9c','purple','c'],['purple','#6b3fa0','purple','c']
].map(([name,hex,fam,kind])=>({name,hex,fam,kind,lab:rgb2lab(...hex2rgb(hex))}));
const FAM_PIVOT={red:30,maroon:16,pink:355,orange:55,yellow:88,green:140,teal:195,blue:255,purple:310,olive:100,brown:65,beige:80,cream:85,navy:265};
const WARM_FAM=new Set(['orange','yellow','brown','beige','cream','olive']),COOL_FAM=new Set(['blue','teal','purple','navy']);
const angTo=(h,t)=>hdiff(h,t);

function denimWash(L,C,spread){
  let w;
  if(C<7) w=L<24?'black denim':'gray denim';
  else if(L<22) w='dark indigo';
  else if(L<30) w='rinse wash';
  else if(L<39) w='dark wash';
  else if(L<52) w='medium wash';
  else if(L<63) w='light wash';
  else w='faded light wash';
  const depth=C<7?'neutral':L<39?'dark':L<52?'medium':'light';
  return{wash:w,depth,uneven:spread>3.2};
}
function looksDenim(l){const{L,C,h}=lch(l);return (h>225&&h<295&&C>6&&C<45&&L>10&&L<80)}

/* describe one piece from its LAB + patch spread */
function describe(lab,opts={}){
  const {L,C,h}=lch(lab);
  let best=null,bd=1e9;for(const s of SHADES){const d=de2000(lab,s.lab);if(d<bd){bd=d;best=s}}
  const p={lab,L,C,h,hex:lab2hex(lab),type:opts.type||'top',denim:!!opts.denim,spread:opts.spread||0};
  if(p.denim){const dw=denimWash(L,C,p.spread);p.name=dw.wash+(p.type==='bottom'?' jeans':' denim');p.shade=dw.wash;p.fam='denim';p.kind='d';p.wash=dw;}
  else{p.name=best.name;p.shade=best.name;p.fam=best.fam;p.kind=(C<7&&best.kind==='c')?'n':best.kind;}
  // undertone from a*/b*: hue angle relative to family pivot; neutrals use b*
  let ut;
  if(p.kind==='d') ut='cool';
  else if(p.kind==='n'&&p.fam!=='navy'){ut=lab[2]>4?'warm':lab[2]<-2?'cool':'neutral'}
  else if(WARM_FAM.has(p.fam)) ut='warm';
  else if(COOL_FAM.has(p.fam)) ut='cool';
  else { const piv=FAM_PIVOT[p.fam]??h; const rel=angTo(piv,270)-angTo(h,270); // >0 → closer to blue pole
    ut=rel>3?'cool':rel<-3?'warm':(lab[2]>lab[1]*0.45?'warm':'cool'); }
  p.under=ut;
  p.depth=L<30?'deep':L<48?'medium-deep':L<66?'medium':'light';
  p.sat=C<12?'muted':C<28?'soft':C<45?'medium':'bold';
  p.neutral=p.kind!=='c';
  p.bold=C>=45&&!p.neutral; p.quiet=C<24||p.neutral;
  p.label=(p.kind==='c'||p.fam==='navy'?(ut==='neutral'?'':ut+' '):'')+p.name;
  if(p.type==='shoes'&&!p.denim)p.label+=' shoes';
  return p;
}

/* ============== pair scoring ============== */
function scorePair(A,B){
  let s=60;const why=[],good=[],bad=[];
  const dL=Math.abs(A.L-B.L);const den=[A,B].find(p=>p.kind==='d'),oth=den===A?B:A;
  const anyN=A.neutral||B.neutral,bothN=A.neutral&&B.neutral;
  if(anyN){s+=12;}
  if(den){s+=8;good.push(`Denim acts like a neutral, so ${den.shade} goes with almost anything.`)}
  if(A.neutral&&!B.neutral||B.neutral&&!A.neutral){const c=A.neutral?B:A,n=A.neutral?A:B;good.push(`${cap(c.shade)} is the color; ${n.shade} is the quiet base.`)}
  // blue-on-blue near miss (navy/blue tops vs denim, or navy vs denim)
  if(den&&oth.kind!=='d'&&(oth.fam==='navy'||oth.fam==='blue')&&hdiff(A.h,B.h)<35){s-=18;bad.push(`${cap(oth.shade)} and ${den.shade} are both blue but not the same blue, so it can look like a near miss.`)}
  let rel='';
  if(!A.neutral&&!B.neutral){
    const dh=hdiff(A.h,B.h);
    if(dh<15){rel='tonal';s+=dL>=12?8:-6;(dL>=12?good:bad).push(dL>=12?'Same color family in two depths: a tonal look.':'Same color, same depth: no separation.')}
    else if(dh<50){rel='analogous';if(A.bold&&B.bold&&dL<30){s-=38;bad.push(`${cap(A.shade)} and ${B.shade} are loud neighboring hues, so they fight each other.`)}else{s+=A.bold||B.bold?4:8;good.push('Neighboring hues blend easily.')}}
    else if(dh<100){rel='offbeat';s-=(A.bold&&B.bold)?20:6;bad.push('These hues sit at an awkward distance on the color wheel.')}
    else if(dh<150){rel='split';s+=(A.bold&&B.bold)?-10:2}
    else{rel='complement';if(A.bold&&B.bold&&dL<20){s-=18;bad.push('Opposite colors, both loud and at the same depth: very busy.')}else{s+=8;good.push('Opposite colors make a bold, intentional contrast.')}}
  }
  // value contrast
  const deepDen=den&&!oth.neutral&&oth.L<42;
  if(dL<6){s-=14;bad.push(`Low contrast: ${A.shade} and ${B.shade} are almost the same depth, so they blur into one block.`)}
  else if(dL<12){s-=6;if(deepDen)good.push('Both are deep, so it reads rich and moody rather than crisp.');else bad.push(`Low contrast: ${A.shade} and ${B.shade} are close in depth${A.L<30&&B.L<30?', so from a distance they read as one dark block':', so it reads soft and a bit muddy'}.`)}
  else if(dL<20){s+=2}
  else if(dL<=40){s+=10;good.push('Good light/dark contrast, so each piece stands out.')}
  else{s+=8;good.push('Strong light/dark contrast: crisp.')}
  // chroma balance
  if((A.bold&&B.quiet)||(B.bold&&A.quiet)){s+=6;good.push('One bold piece plus one quiet piece is the easy formula.')}
  else if(A.bold&&B.bold){s-=8;}
  // undertone

function suggestFor(base,current,profile){

/* ============== image sampling ============== */
function kmeans(pts,k=3,it=10){
  const srt=[...pts].sort((a,b)=>a[0]-b[0]);let C=[.15,.5,.85].slice(0,k).map(q=>[...srt[Math.floor(q*(srt.length-1))]]);

  for(let t=0;t<it;t++){for(let i=0;i<pts.length;i++){let bi=0,bd=1e9;for(let j=0;j<k;j++){const d=(pts[i][0]-C[j][0])**2+(pts[i][1]-C[j][1])**2+(pts[i][2]-C[j][2])**2;if(d<bd){bd=d;bi=j}}asg[i]=bi}
    const S=C.map(()=>[0,0,0,0]);pts.forEach((p,i)=>{const s=S[asg[i]];s[0]+=p[0];s[1]+=p[1];s[2]+=p[2];s[3]++});S.forEach((s,j)=>{if(s[3])C[j]=[s[0]/s[3],s[1]/s[3],s[2]/s[3]]})}
  const n=C.map(()=>0);asg.forEach(a=>n[a]++);return C.map((c,j)=>({c,n:n[j]}));
}

function samplePiece(img,pt,wb){
  const cv=document.createElement('canvas'),S=240,sc=S/Math.max(img.width,img.height);cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
  const x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,cv.width,cv.height);const D=x.getImageData(0,0,cv.width,cv.height).data,w=cv.width,h=cv.height;

  // border = background estimate
  const bpts=[];for(let i=0;i<w;i+=4){bpts.push(at(i,1),at(i,h-2))}for(let j=0;j<h;j+=4){bpts.push(at(1,j),at(w-2,j))}

  const auto=!pt;const cx=(pt?pt.x:.5)*w,cy=(pt?pt.y:.5)*h,R=(auto?.24:.11)*Math.min(w,h);
  const pts=[];for(let j=Math.max(0,cy-R|0);j<Math.min(h,cy+R);j+=1)for(let i=Math.max(0,cx-R|0);i<Math.min(w,cx+R);i+=1){if((i-cx)**2+(j-cy)**2<=R*R)pts.push(at(i,j))}
  if(!pts.length)return null;
  let cl=kmeans(pts,3).sort((a,b)=>b.n-a.n);
  let pick=cl.find(c=>c.n>pts.length*.12&&de2000(c.c,bg)>10)||cl[0];

    for(let j=Math.max(0,py-rr|0);j<Math.min(h,py+rr);j++)for(let i=Math.max(0,px-rr|0);i<Math.min(w,px+rr);i++){const p=at(i,j);if(de2000(p,lab)<22){s+=p[0];n++}}if(n>8)pm.push(s/n)}
  const mu=pm.reduce((a,v)=>a+v,0)/(pm.length||1);const spread=pm.length>2?Math.sqrt(pm.reduce((a,v)=>a+(v-mu)**2,0)/pm.length):0;

}
function whiteGains(img,pt){const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;const x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);

  const d=x.getImageData(Math.max(0,cx-R),Math.max(0,cy-R),2*R,2*R).data;let r=0,g=0,b=0,n=0;for(let i=0;i<d.length;i+=4){r+=lin(d[i]);g+=lin(d[i+1]);b+=lin(d[i+2]);n++}
  r/=n;g/=n;b/=n;const m=Math.max(r,g,b,1e-4);return[m/Math.max(r,1e-4),m/Math.max(g,1e-4),m/Math.max(b,1e-4)]}
function sampleSmall(img,pt){const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;const x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);

  const main2=pairs.find(p=>p.i===0&&p.j===1)||worst; // top + bottom drives the headline
  const verdict=worst.r.verdict==='clash'?'clash':pairs.every(p=>p.r.verdict==='match')?'match':(main2.r.verdict==='match'&&worst.r.verdict!=='clash'&&worst.r.s>=65?'match':'works');

    if(sh.length)tips.push(`Shoes from your closet: your <b>${esc(sh[0].d.label)}</b> work best here.`);
    else{const dark=ds.every(d=>d.L<45);tips.push(dark?'White sneakers (if you have them) make this look fresh. Black sneakers keep it low-key. Both work.':'Black or white sneakers you already own both work; pick black for a sharper look.')}}
  if(res.worst.r.dL<8)tips.push('Low contrast: break it up with something lighter you own between them, like a white tee peeking out or white sneakers, or put the lighter piece on top.');
  if(res.verdict==='clash'){const bad=res.worst;const keep=ds[bad.i],swap=ds[bad.j];const alt=owned(swap.type,[keep]).filter(c=>c.sc>=60);
    tips.unshift(alt.length?`Swap the ${esc(swap.shade)} for your <b>${esc(alt[0].d.label)}</b> (already in your closet).`:`Swap the ${esc(swap.shade)} for something neutral you already own: black, gray, white, or denim.`)}
  const den=ds.find(d=>d.kind==='d');if(den&&res.verdict!=='clash')tips.push(den.wash.depth==='light'?'Cuff the jeans once and push up the sleeves for a relaxed look.':'Tuck just the front of the top to show the waist. It looks more put-together.');

   <div class="verdict"><span class="badge ${res.verdict}" id="verdict">${res.verdict==='match'?'✓ MATCH':res.verdict==='works'?'👍 WORKS':'✗ CLASH'}</span><span class="note">score ${r.s}/100${pieces.length>2?` · weakest pair ${res.worst.r.s}`:''}</span></div>
   <div class="why" id="why">${esc(why)}</div>
   <ul class="r">${bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>
   <div class="tip"><b>${res.verdict==='clash'?'Fix it with what you own':'Make it pop (with what you own)'}:</b><br>${tips.join('<br>')}</div>
   ${pn?`<div class="note" style="margin-top:10px">${esc(pn)}</div>`:''}
   <div style="margin-top:12px"><b style="font-size:13.5px">Shades that would also work with your ${esc(B.shade)}</b><div class="note">Check your closet for these. No shopping needed.</div>
   <div class="swrow">${sug.map(x=>`<div><span class="sw" style="background:${x.c.hex}"></span>${esc(x.c.name)}</div>`).join('')}</div></div>
   <div class="note" style="margin-top:12px">💡 Colors depend on light. Indoor bulbs make things look warmer, and shade makes them look bluer. For a truer read, use daylight or tap <b>⚪ White balance</b> and then something white in the photo.</div>
  </div>`}
function vCheck(){
  const P=state.pieces;
  main.innerHTML=(P.length?'':`<div class="card"><b>Snap 2–5 pieces</b><div class="note">Top first, then bottoms, then shoes or a layer if you like.</div></div>`)+
   P.map((p,i)=>pieceCard(p,i,{rm:true,save:true})).join('')+
   (P.length<5?`<button class="btn acc" id="addP" style="margin:6px 0">📷 ${P.length?'Snap next piece':'Snap first piece'}</button>`:'')+
   resultCard(P)+(P.length?`<button class="btn ghost" id="clr" style="margin-top:4px">Start over</button>`:'');

/* ---------- Dress me ---------- */
const OCC=[['work','Work'],['casual','Casual'],['date','Date'],['church','Church'],['event','Event']];
const WX=[['','No weather'],['hot','Hot'],['mild','Mild'],['cold','Cold'],['rain','Rain']];
function occAdj(ds,occ){let a=0;const den=ds.find(d=>d.kind==='d');const bolds=ds.filter(d=>d.bold).length;
  if(occ==='work'||occ==='church'){a-=bolds*5;if(den)a-=5;a+=ds.filter(d=>d.neutral).length*2;if(den&&den.wash.depth==='light')a-=8;if(den&&den.wash.uneven)a-=4}
  if(occ==='date'){if(bolds===1)a+=6;if(den&&den.wash.depth==='dark')a+=4;a+=ds.some(d=>d.L<35)?3:0}
  if(occ==='event'){if(den)a-=den.wash.depth==='dark'?3:9;a+=ds.some(d=>d.L<30)&&ds.some(d=>d.L>70)?5:0}
  if(occ==='casual'){if(den)a+=4}return a}
function rankOutfits(items,occ,wx){
  const D=items.map(it=>({it,d:describe(it.lab,{type:it.type,denim:it.denim,spread:it.spread})}));
  const tops=D.filter(x=>x.d.type==='top'),bots=D.filter(x=>x.d.type==='bottom'),dresses=D.filter(x=>x.d.type==='dress'),shoes=D.filter(x=>x.d.type==='shoes'),layers=D.filter(x=>x.d.type==='layer');
  const fb=JSON.parse(localStorage.getItem('fb_fb')||'{}');const bases=[];
  tops.forEach(t=>bots.forEach(b=>bases.push([t,b])));dresses.forEach(d=>bases.push([d]));
  const out=[];
  for(const base of bases){
    const bd=base.map(x=>x.d);let s=bd.length===2?scorePair(bd[0],bd[1]).s:72;const parts=[...base];
    if(shoes.length){const sc=shoes.map(sh=>({sh,v:Math.min(...bd.map(b=>scorePair(sh.d,b).s))})).sort((a,b)=>b.v-a.v)[0];parts.push(sc.sh);s=s*.75+sc.v*.25}
    if(layers.length&&(wx==='cold'||wx==='rain'||occ==='event'||occ==='work')){const lc=layers.map(l=>({l,v:Math.min(...bd.map(b=>scorePair(l.d,b).s))})).sort((a,b)=>b.v-a.v)[0];if(lc.v>=55||wx==='cold'){parts.push(lc.l);s=s*.8+lc.v*.2}}
    const pds=parts.map(p=>p.d);s+=occAdj(pds,occ);
    if(state.profile&&state.profile.palette){const top=pds.find(d=>d.type==='top'||d.type==='dress');if(top){const pd=Math.min(...state.profile.palette.map(h=>de2000(top.lab,rgb2lab(...hex2rgb(h)))));if(pd<14)s+=4}}
    if(wx==='hot')s-=pds.filter(d=>d.L<30).length*2;
    const key=parts.map(p=>p.it.id).sort().join('|');if(fb[key]===1)s+=5;if(fb[key]===-1)s-=15;
    out.push({parts,s:Math.round(s),key});
  }
  out.sort((a,b)=>b.s-a.s);const pick=[];for(const o of out){const used=pick.filter(p=>p.parts.filter(x=>o.parts.includes(x)).length>=2).length;if(!used||pick.length<1)pick.push(o);if(pick.length===3)break}
  if(pick.length<Math.min(3,out.length))for(const o of out){if(!pick.includes(o))pick.push(o);if(pick.length>=3)break}
  return pick;
}
function outfitTips(o,occ,wx){const ds=o.parts.map(p=>p.d),t=[];const den=ds.find(d=>d.kind==='d');const has=x=>ds.some(d=>d.type===x);
  if(occ==='work'||occ==='church')t.push('Tuck the top in fully and roll the sleeves neatly, or leave them down.');
  if(occ==='date')t.push('Roll the sleeves twice and add the one accessory you love.');
  if(occ==='casual')t.push(den?'Front-tuck the top and cuff the jeans once.':'Leave the top untucked for an easy feel.');
  if(occ==='event')t.push('Fully tuck and add a belt you own to sharpen the shape.');
  if(!has('shoes'))t.push('Shoes: plain white or black ones you own will work.');
  if((wx==='cold'||wx==='rain')&&!has('layer'))t.push('Add a layer you own on top: denim, black, gray, or camel go with this.');
  if(wx==='hot')t.push('Push up the sleeves and go lighter on layers.');
  if(wx==='rain')t.push('Pick darker shoes you own; they hide splashes.');
  return t.slice(0,3)}
function vDress(){const S=state.dress;
  main.innerHTML=`<div class="card"><b>Where are you going?</b><div class="chips">${OCC.map(([k,t])=>`<span class="chip ${S.occ===k?'on':''}" data-occ="${k}">${t}</span>`).join('')}</div>
   <b>Weather</b> <span class="note">(optional)</span><div class="chips">${WX.map(([k,t])=>`<span class="chip ${S.wx===k?'on':''}" data-wx="${k}">${t}</span>`).join('')}</div>
   <b>Use</b><div class="chips"><span class="chip ${S.src==='closet'?'on':''}" data-src="closet">My closet (${state.closet.length})</span><span class="chip ${S.src==='snap'?'on':''}" data-src="snap">Snap 2–5 pieces now</span></div></div>
   ${S.src==='snap'?S.snap.map((p,i)=>pieceCard(p,i,{rm:true})).join('')+(S.snap.length<5?`<button class="btn acc" id="snapP">📷 Snap ${S.snap.length?'another':'a'} piece</button>`:''):''}
   <div id="outs"></div>`;
  main.querySelectorAll('[data-occ]').forEach(c=>c.onclick=()=>{S.occ=c.dataset.occ;vDress()});
  main.querySelectorAll('[data-wx]').forEach(c=>c.onclick=()=>{S.wx=c.dataset.wx;vDress()});
  main.querySelectorAll('[data-src]').forEach(c=>c.onclick=()=>{S.src=c.dataset.src;vDress()});
  if(S.src==='snap'){bindPieces(S.snap,vDress);const b=$('#snapP');if(b)b.onclick=()=>askPhoto(async d=>{S.snap.push(await makePiece(d,defaultType(S.snap.length)));vDress()})}
  const items=S.src==='closet'?state.closet:S.snap.map(p=>({id:p.id,img:p.img,lab:p.lab,spread:p.spread,type:p.type,denim:p.denim}));
  const outs=$('#outs');const tops=items.filter(i=>i.type==='top'||i.type==='dress').length,bots=items.filter(i=>i.type==='bottom'||i.type==='dress').length;
  if(!tops||!bots){outs.innerHTML=`<div class="card note">Need at least one top and one bottom (or a dress). ${S.src==='closet'?'Add pieces in <b>My closet</b> or switch to <b>Snap now</b>.':'Snap them and set each type.'}</div>`;return}
  const ranked=rankOutfits(items,S.occ,S.wx);const fb=JSON.parse(localStorage.getItem('fb_fb')||'{}');
  outs.innerHTML=ranked.map((o,n)=>{const ds=o.parts.map(p=>p.d);const pr=ds.length>1?scorePair(ds[0],ds[1]):null;const v=o.s>=75?'match':o.s>=52?'works':'clash';
    return `<div class="outfit" data-outfit="${n}"><div class="row" style="justify-content:space-between"><span class="rank">#${n+1} for ${S.occ}</span><span class="badge ${v}" style="font-size:12px;padding:4px 8px">${v.toUpperCase()} · ${o.s}</span></div>
    <div class="pcs">${o.parts.map(p=>`<img src="${p.it.img}" alt="${esc(p.d.label)}">`).join('')}</div>
    <div style="font-weight:600;font-size:14.5px">${ds.map(d=>esc(d.label)).join(' + ')}</div>
    ${pr?`<div class="note" style="margin:3px 0 0">${esc(cap(character(ds[0],ds[1],pr)))}.</div>`:''}
    <div class="tip" style="font-size:13px"><b>Make it work:</b> ${outfitTips(o,S.occ,S.wx).map(esc).join(' ')}</div>
    <div class="row" style="margin-top:8px"><span class="chip ${fb[o.key]===1?'on':''}" data-up="${n}">👍</span><span class="chip ${fb[o.key]===-1?'on':''}" data-down="${n}">👎</span></div></div>`}).join('')+
    (ranked.length&&ranked[0].s<52?`<div class="card note">Nothing scores great. Try a neutral piece you own (black, white, gray, or denim) as the bottom or layer.</div>`:'');
  const setFb=(n,v)=>{const f=JSON.parse(localStorage.getItem('fb_fb')||'{}');f[ranked[n].key]=f[ranked[n].key]===v?0:v;localStorage.setItem('fb_fb',JSON.stringify(f));vDress()};
  outs.querySelectorAll('[data-up]').forEach(c=>c.onclick=()=>setFb(+c.dataset.up,1));outs.querySelectorAll('[data-down]').forEach(c=>c.onclick=()=>setFb(+c.dataset.down,-1));
}

/* ---------- Closet ---------- */
function vCloset(){
  const C=state.closet;
  main.innerHTML=`<button class="btn acc" id="addI" style="margin:6px 0 10px">📷 Add a piece</button>
   <div class="note" style="margin-bottom:8px">Snap one item at a time (on the bed or a hanger is fine). Aim for 10–20 pieces. Everything stays on this phone.</div>

/* ---------- My colors (profile) ---------- */
const SEASONS={
 'Spring':{desc:'warm, light, and clear',pal:['#f27c6b','#f5b895','#f3e3a0','#a8c545','#3fb5b0','#87b6e0','#c19a6b','#ece0c4','#e5533d','#1f7a4d']},
 'Summer':{desc:'cool, soft, and light',pal:['#b5cce3','#5a6e8c','#c8a2c8','#c08081','#a57a8b','#9caf88','#8a8d91','#f4f4f2','#1f2a44','#7a1e33']},
 'Autumn':{desc:'warm, deep, and earthy',pal:['#c1561e','#c9a227','#636332','#9a4e25','#c66b4b','#1f7a7a','#7e3326','#c3b091','#45302a','#2c4a34']},
 'Winter':{desc:'cool, deep, and high contrast',pal:['#141414','#f4f4f2','#1f2a44','#6a2139','#c41e2a','#2a52be','#1f7a4d','#e0408e','#6b3fa0','#5b6470']}};
const SHAPES={hourglass:'Shoulders and hips about even with a defined waist. Tucks, belts, and wrap shapes show the waist.',pear:'Hips wider than shoulders. A brighter or lighter top and darker bottoms balance it. Structured shoulders help.',
 'inverted triangle':'Shoulders wider than hips. Keep tops simple and darker; bring the lighter color or detail to the bottom half.',rectangle:'Shoulders, waist, and hips about even. Layers, a front tuck, or a belt create shape.',round:'Fuller through the middle. One color top to bottom, open layers, and V-necks make a long line.'};
function seasonFrom(skin,hair){const s=lch(skin),hl=hair?hair[0]:40;const contrast=s.L-hl;
  const warm=s.h>=58,cool=s.h<50;let season;
  if(warm)season=(hl>45||contrast<22)?'Spring':'Autumn';else if(cool)season=(contrast>40||hl<22)?'Winter':'Summer';else season=contrast>40?'Winter':hl<30?'Autumn':'Summer';
  return{season,under:warm?'warm':cool?'cool':'neutral',contrast:Math.round(contrast)}}
function shapeFrom(b,w,h){if(!(b>0&&w>0&&h>0))return null;if(w>=b*.95&&w>=h*.95)return'round';if(Math.abs(b-h)/h<=.05&&w<=Math.min(b,h)*.78)return'hourglass';if(h>b*1.05)return'pear';if(b>h*1.05)return'inverted triangle';return'rectangle'}
async function vMe(){
  const pr=state.profile||{};const ph=await KV.get('profilePhoto');state.mode=state.mode||'skin';
  main.innerHTML=`<div class="card"><b>Color palette estimate</b><div class="note">Take one full-body photo in daylight, then tap your skin (cheek), hair, and eyes. The phone samples those colors. It's an estimate, not a pro color analysis.</div>
   ${ph?`<div style="position:relative;margin-top:10px"><canvas id="pc" width="300" height="400" style="width:100%;border-radius:14px;cursor:crosshair"></canvas></div>
   <div class="chips">${['skin','hair','eyes'].map(m=>`<span class="chip ${state.mode===m?'on':''}" data-mode="${m}">Tap ${m}${pr[m]?' ✓':''}</span>`).join('')}</div>`:''}
   <button class="btn ${ph?'ghost':'acc'}" id="pp" style="margin-top:8px">📷 ${ph?'Retake photo':'Take full-body photo'}</button>
   ${pr.season?`<div style="margin-top:14px"><div class="row"><b style="font-size:17px">${pr.season}</b><span class="note">estimate · ${SEASONS[pr.season].desc} · undertone ${pr.under}</span></div>
     <div class="swrow">${SEASONS[pr.season].pal.map(h=>`<div><span class="sw" style="background:${h}"></span>${esc((SHADES.find(s=>s.hex===h)||{name:''}).name)}</div>`).join('')}</div>
     <div class="note" style="margin-top:6px">Your best colors to wear near your face. The match check uses this.</div></div>`:''}
  </div>
  <div class="card"><b>Body shape</b> <span class="note">from your numbers or your pick (the app doesn't measure you)</span>
   <div class="row" style="flex-wrap:nowrap;gap:6px">${['bust','waist','hips'].map(k=>`<div style="flex:1"><label class="f">${k==='bust'?'Bust/chest':cap(k)}</label><input class="n" inputmode="decimal" id="m_${k}" value="${pr.m?pr.m[k]||'':''}" placeholder="in or cm"></div>`).join('')}</div>
   <button class="btn sm" id="calcS" style="margin-top:8px">Work it out</button>
   <div class="note" style="margin-top:10px">or pick one:</div><div class="chips">${Object.keys(SHAPES).map(s=>`<span class="chip ${pr.shape===s?'on':''}" data-shape="${s}">${cap(s)}</span>`).join('')}</div>
   ${pr.shape?`<div class="tip"><b>${cap(pr.shape)}</b> (${pr.shapeSrc==='measure'?'from your measurements':'your pick'}): ${SHAPES[pr.shape]}</div>`:''}
  </div>
  <div class="card"><b>Privacy</b><div class="note" style="margin:4px 0 10px">All photos and results are stored only on this phone (in browser storage). Nothing is uploaded or used for training. Public use is for 18+; younger people should use it with a parent's OK.</div>
   <button class="btn danger" id="wipe">🗑 Delete all my photos and data</button></div>`;
  const save=async()=>{state.profile=pr;await KV.set('profile',pr)};
  $('#pp').onclick=()=>askPhoto(async d=>{await KV.set('profilePhoto',d);delete pr.skin;delete pr.hair;delete pr.eyes;delete pr.season;state.mode='skin';await save();vMe()},'user');
  main.querySelectorAll('[data-mode]').forEach(c=>c.onclick=()=>{state.mode=c.dataset.mode;vMe()});
  main.querySelectorAll('[data-shape]').forEach(c=>c.onclick=async()=>{pr.shape=c.dataset.shape;pr.shapeSrc='pick';await save();vMe()});
  $('#calcS').onclick=async()=>{const m={bust:parseFloat($('#m_bust').value),waist:parseFloat($('#m_waist').value),hips:parseFloat($('#m_hips').value)};const s=shapeFrom(m.bust,m.waist,m.hips);if(!s){toast('Enter all three numbers');return}pr.m=m;pr.shape=s;pr.shapeSrc='measure';await save();vMe()};
  $('#wipe').onclick=async()=>{if(!confirm('Delete every photo, closet item, and result on this phone?'))return;await wipeAll();toast('Everything deleted');go('home')};
  if(ph){const img=await loadImg(ph),cv=$('#pc'),x=cv.getContext('2d');cv.height=Math.round(cv.width*img.height/img.width);x.drawImage(img,0,0,cv.width,cv.height);
    ['skin','hair','eyes'].forEach(k=>{if(pr[k+'Pt']){x.strokeStyle='#fff';x.lineWidth=2.5;x.beginPath();x.arc(pr[k+'Pt'].x*cv.width,pr[k+'Pt'].y*cv.height,8,0,7);x.stroke();x.fillStyle='#fff';x.font='bold 11px sans-serif';x.fillText(k,pr[k+'Pt'].x*cv.width+11,pr[k+'Pt'].y*cv.height+4)}});
    cv.onclick=async e=>{const r=cv.getBoundingClientRect(),pt={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};pr[state.mode]=sampleSmall(img,pt);pr[state.mode+'Pt']=pt;
      if(pr.skin){const s=seasonFrom(pr.skin,pr.hair);pr.season=s.season;pr.under=s.under;pr.palette=SEASONS[s.season].pal}
      state.mode=state.mode==='skin'?'hair':state.mode==='hair'?'eyes':'eyes';await save();vMe()}}
}
