function occAdj(ds,occ){let a=0;const den=ds.find(d=>d.kind==='d');const bolds=ds.filter(d=>d.bold).length;

  if(occ==='event'){if(den)a-=den.wash.depth==='dark'?3:9;a+=ds.some(d=>d.L<30)&&ds.some(d=>d.L>70)?5:0}
  if(occ==='casual'){if(den)a+=4}return a}
function rankOutfits(items,occ,wx){
  const D=items.map(it=>({it,d:describe(it.lab,{type:it.type,denim:it.denim,spread:it.spread})}));
  const tops=D.filter(x=>x.d.type==='top'),bots=D.filter(x=>x.d.type==='bottom'),dresses=D.filter(x=>x.d.type==='dress'),shoes=D.filter(x=>x.d.type==='shoes'),layers=D.filter(x=>x.d.type==='layer');
  const fb=JSON.parse(localStorage.getItem('fb_fb')||'{}');const bases=[];
  tops.forEach(t=>bots.forEach(b=>bases.push([t,b])));dresses.forEach(d=>bases.push([d]));
  const out=[];
  for(const base of bases){
    const bd=base.map(x=>x.d);let s=bd.length===2?scorePair(bd[0],bd[1]).s:72;const parts=[...base];
    if(shoes.length){const sc=shoes.map(sh=>({sh,v:Math.min(...bd.map(b=>scorePair(sh.d,b).s))})).sort((a,b)=>b.v-a.v)[0];parts.push(sc.sh);s=s*.75+sc.v*.25}
    if(layers.length&&(wx==='cold'||wx==='rain'||occ==='event'||occ==='work')){const lc=layers.map(l=>({l,v:Math.min(...bd.map(b=>scorePair(l.d,b).s))})).sort((a,b)=>b.v-a.v)[0];if(lc.v>=55||wx==='cold'){parts.push(lc.l);s=s*.8+lc.v*.2}}
    const pds=parts.map(p=>p.d);s+=occAdj(pds,occ);
    if(state.profile&&state.profile.palette){const top=pds.find(d=>d.type==='top'||d.type==='dress');if(top){const pd=Math.min(...state.profile.palette.map(h=>de2000(top.lab,rgb2lab(...hex2rgb(h)))));if(pd<14)s+=4}}
    if(wx==='hot')s-=pds.filter(d=>d.L<30).length*2;

  return pick;
}

   ${ph?`<div style="position:relative;margin-top:10px"><canvas id="pc" width="300" height="400" style="width:100%;border-radius:14px;cursor:crosshair"></canvas></div>
   <div class="chips">${['skin','hair','eyes'].map(m=>`<span class="chip ${state.mode===m?'on':''}" data-mode="${m}">Tap ${m}${pr[m]?' ✓':''}</span>`).join('')}</div>`:''}
   <button class="btn ${ph?'ghost':'acc'}" id="pp" style="margin-top:8px">📷 ${ph?'New photo':'Add a full-body photo'}</button>
   ${pr.season?`<div style="margin-top:14px"><div class="row"><b style="font-size:17px">${pr.season}</b><span class="note">estimate · ${SEASONS[pr.season].desc} · undertone ${pr.under}</span></div>
     <div class="swrow">${SEASONS[pr.season].pal.map(h=>`<div><span class="sw" style="background:${h}"></span>${esc((SHADES.find(s=>s.hex===h)||{name:''}).name)}</div>`).join('')}</div>
     <div class="note" style="margin-top:6px">Your best colors to wear near your face. The match check uses this.</div></div>`:''}
  </div>
  <div class="card"><b>Body shape</b> <span class="note">from your numbers or your pick (the app doesn't measure you)</span>
   <div class="row" style="flex-wrap:nowrap;gap:6px">${['bust','waist','hips'].map(k=>`<div style="flex:1"><label class="f">${k==='bust'?'Bust/chest':cap(k)}</label><input class="n" inputmode="decimal" id="m_${k}" value="${pr.m?pr.m[k]||'':''}" placeholder="in or cm"></div>`).join('')}</div>
   <button class="btn sm" id="calcS" style="margin-top:8px">Work it out</button>
   <div class="note" style="margin-top:10px">or pick one:</div><div class="chips">${Object.keys(SHAPES).map(s=>`<span class="chip ${pr.shape===s?'on':''}" data-shape="${s}">${cap(s)}</span>`).join('')}</div>
   ${pr.shape?`<div class="tip"><b>${cap(pr.shape)}</b> (${pr.shapeSrc==='measure'?'from your measurements':'your pick'}): ${SHAPES[pr.shape]}</div>`:''}
  </div>
  <div class="card"><b>Privacy</b><div class="note" style="margin:4px 0 10px">All photos and results are stored only on this phone (in browser storage). Photos are never uploaded or used for training. The only download is the free on-phone clothes finder (from Google's MediaPipe), once. Public use is for 18+; younger people should use it with a parent's OK.</div>
   <button class="btn danger" id="wipe">🗑 Delete all my photos and data</button></div>`;
  const save=async()=>{state.profile=pr;await KV.set('profile',pr)};
  $('#pp').onclick=()=>askPhoto(async d=>{await KV.set('profilePhoto',d);delete pr.skin;delete pr.hair;delete pr.eyes;delete pr.season;state.mode='skin';await save();vMe()},'user');
  main.querySelectorAll('[data-mode]').forEach(c=>c.onclick=()=>{state.mode=c.dataset.mode;vMe()});
  main.querySelectorAll('[data-shape]').forEach(c=>c.onclick=async()=>{pr.shape=c.dataset.shape;pr.shapeSrc='pick';await save();vMe()});
  $('#calcS').onclick=async()=>{const m={bust:parseFloat($('#m_bust').value),waist:parseFloat($('#m_waist').value),hips:parseFloat($('#m_hips').value)};const s=shapeFrom(m.bust,m.waist,m.hips);if(!s){toast('Enter all three numbers');return}pr.m=m;pr.shape=s;pr.shapeSrc='measure';await save();vMe()};
  $('#wipe').onclick=async()=>{if(!confirm('Delete every photo, closet item, and result on this phone?'))return;await wipeAll();toast('Everything deleted');go('home')};
  if(ph){const img=await loadImg(ph),cv=$('#pc'),x=cv.getContext('2d');cv.height=Math.round(cv.width*img.height/img.width);x.drawImage(img,0,0,cv.width,cv.height);
    ['skin','hair','eyes'].forEach(k=>{if(pr[k+'Pt']){x.strokeStyle='#fff';x.lineWidth=2.5;x.beginPath();x.arc(pr[k+'Pt'].x*cv.width,pr[k+'Pt'].y*cv.height,8,0,7);x.stroke();x.fillStyle='#fff';x.font='bold 11px sans-serif';x.fillText(k,pr[k+'Pt'].x*cv.width+11,pr[k+'Pt'].y*cv.height+4)}});
    cv.onclick=async e=>{const r=cv.getBoundingClientRect(),pt={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};pr[state.mode]=sampleSmall(img,pt);pr[state.mode+'Pt']=pt;
      if(pr.skin){const s=seasonFrom(pr.skin,pr.hair);pr.season=s.season;pr.under=s.under;pr.palette=SEASONS[s.season].pal}
      state.mode=state.mode==='skin'?'hair':state.mode==='hair'?'eyes':'eyes';await save();vMe()}}
}

/* ============== router & boot ============== */
const TITLES={home:'Fit Bounty',scan:'Shade check',closet:'Closet',dress:'Dress me',me:'My colors'};
function render(){const v=state.view;$('#title').textContent=TITLES[v]||'Fit Bounty';if(v==='home')vHome();else if(v==='scan')vScan();else if(v==='closet')vCloset();else if(v==='dress')vDress();else if(v==='me')vMe()}
function go(v){state.view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===v||(v==='scan'&&b.dataset.go==='home')));$('#back').style.display=v==='home'?'none':'block';render();main.scrollTop=0}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.go));$('#back').onclick=()=>go('home');
(async()=>{
  const mf={name:'Fit Bounty (working title)',short_name:'Fit Bounty',start_url:location.href.split('#')[0],display:'standalone',background_color:'#0a0a0c',theme_color:'#0a0a0c',icons:[{src:document.querySelector('link[rel=icon]').href,sizes:'any',type:'image/svg+xml'}]};
  $('#mf').href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(mf));
  try{state.closet=(await Items.all())||[];state.profile=(await KV.get('profile'))||null}catch(e){state.closet=[]}
  render();
})();
/* test hooks (no network, no data) */
window.FB={describe,scorePair,character,rgb2lab,hex2rgb,buildPhoto,detectPieces,pickAt,matchResult,tipsFor,state,startScan,setWhiteAt,redescribe,loadSegmenter};
</script>
</body>
